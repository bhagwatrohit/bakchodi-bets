services:
  db:
    image: postgres:16
    container_name: bakchodi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bakchodi
      POSTGRES_PASSWORD: bakchodi
      POSTGRES_DB: bakchodi
    ports:
      - "5432:5432"
    volumes:
      - bakchodi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakchodi -d bakchodi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bakchodi_pgdata:
